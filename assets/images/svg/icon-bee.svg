    <linearGradient y2="100%" x2="0%" y1="0%" x1="0%" id="bodyYellow">
      <stop stop-color="#FFE566" offset="0%"></stop>
      <stop stop-color="#FFD700" offset="50%"></stop>
      <stop stop-color="#FFC107" offset="100%"></stop>
    </linearGradient>
    
    <linearGradient y2="100%" x2="0%" y1="0%" x1="0%" id="bodyBlack">
      <stop stop-color="#4A4A4A" offset="0%"></stop>
      <stop stop-color="#2C2C2C" offset="100%"></stop>
    </linearGradient>
    
    <radialGradient r="55%" cy="35%" cx="40%" id="eyeWhite">
      <stop stop-color="#FFFFFF" offset="0%"></stop>
      <stop stop-color="#F0F0F0" offset="100%"></stop>
    </radialGradient>
    
    <radialGradient r="50%" cy="50%" cx="50%" id="cheek">
      <stop stop-color="#FF9AA2" offset="0%"></stop>
